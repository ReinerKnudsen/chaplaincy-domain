<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Donate — Anglican Chaplaincy of Bonn and Cologne</title>
		<meta
			name="description"
			content="Support the work of the Anglican Chaplaincy of Bonn and Cologne with your donation."
		/>
		<link rel="icon" href="favicon.png" />
		<meta name="theme-color" content="#1e3a5f" />

		<style>
			/* Alles inline und ohne externe Requests: keine Fonts, keine Skripte,
			   kein Tracking von Dritten — damit braucht die Seite auch kein
			   Cookie-Banner, das zwischen Besucher und Spende steht. */

			:root {
				--bg: #f7f6f3;
				--surface: #ffffff;
				--ink: #1a1a1a;
				--ink-soft: #5a5a5a;
				--line: #dedad2;
				--accent: #1e3a5f;
				--accent-ink: #ffffff;
				--focus: #b8860b;
				--radius: 12px;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #16181c;
					--surface: #1f2228;
					--ink: #f2f2f0;
					--ink-soft: #a8a8a4;
					--line: #343840;
					--accent: #7da7d4;
					--accent-ink: #12151a;
					--focus: #e0b352;
				}
			}

			* {
				box-sizing: border-box;
			}

			html {
				-webkit-text-size-adjust: 100%;
			}

			body {
				margin: 0;
				padding: 2rem 1rem 3rem;
				background: var(--bg);
				color: var(--ink);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				font-size: 1.0625rem;
				line-height: 1.6;
				display: flex;
				justify-content: center;
			}

			main {
				width: 100%;
				max-width: 27rem;
			}

			/* --- Sprachumschalter ------------------------------------------- */

			.lang {
				display: flex;
				justify-content: flex-end;
				gap: 0.5rem;
				margin-bottom: 1.5rem;
			}

			.lang button {
				display: grid;
				place-items: center;
				width: 44px;
				height: 44px;
				padding: 0;
				border: 2px solid transparent;
				border-radius: 50%;
				background: none;
				cursor: pointer;
				opacity: 0.45;
				transition:
					opacity 0.15s,
					border-color 0.15s;
			}

			.lang button[aria-pressed='true'] {
				opacity: 1;
				border-color: var(--accent);
			}

			.lang button:hover {
				opacity: 1;
			}

			.lang svg {
				width: 26px;
				height: 26px;
				border-radius: 50%;
				display: block;
			}

			/* --- Kopf -------------------------------------------------------- */

			header {
				text-align: center;
				margin-bottom: 2rem;
			}

			header img {
				width: 180px;
				max-width: 70%;
				height: auto;
				margin-bottom: 1.25rem;
			}

			h1 {
				font-size: 1.375rem;
				font-weight: 600;
				line-height: 1.3;
				letter-spacing: -0.01em;
				margin: 0 0 0.75rem;
			}

			.lead {
				margin: 0;
				color: var(--ink-soft);
			}

			/* --- Betragsauswahl ---------------------------------------------- */

			fieldset {
				margin: 0 0 1.25rem;
				padding: 0;
				border: 0;
			}

			legend {
				padding: 0;
				margin-bottom: 0.75rem;
				font-size: 0.9375rem;
				font-weight: 600;
			}

			.amounts {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 0.625rem;
			}

			.amounts label {
				position: relative;
			}

			.amounts input {
				position: absolute;
				opacity: 0;
				width: 0;
				height: 0;
			}

			.amounts span {
				display: grid;
				place-items: center;
				min-height: 60px;
				border: 2px solid var(--line);
				border-radius: var(--radius);
				background: var(--surface);
				font-size: 1.25rem;
				font-weight: 600;
				cursor: pointer;
				transition:
					border-color 0.15s,
					background 0.15s;
			}

			.amounts span:hover {
				border-color: var(--accent);
			}

			.amounts input:checked + span {
				border-color: var(--accent);
				background: var(--accent);
				color: var(--accent-ink);
			}

			.amounts input:focus-visible + span {
				outline: 3px solid var(--focus);
				outline-offset: 2px;
			}

			/* --- Eigener Betrag ---------------------------------------------- */

			.custom {
				margin-top: 0.625rem;
			}

			.custom label {
				display: block;
				margin-bottom: 0.375rem;
				font-size: 0.9375rem;
				color: var(--ink-soft);
			}

			.custom-field {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				border: 2px solid var(--line);
				border-radius: var(--radius);
				background: var(--surface);
				padding: 0 0.875rem;
			}

			.custom-field:focus-within {
				border-color: var(--accent);
			}

			.custom-field input {
				flex: 1;
				min-width: 0;
				min-height: 56px;
				border: 0;
				background: none;
				color: inherit;
				font: inherit;
				font-size: 1.25rem;
				font-weight: 600;
			}

			.custom-field input:focus {
				outline: none;
			}

			.custom-field .currency {
				font-size: 1.25rem;
				font-weight: 600;
				color: var(--ink-soft);
			}

			/* --- Aktion ------------------------------------------------------ */

			.cta {
				display: block;
				width: 100%;
				min-height: 56px;
				margin-top: 1.5rem;
				padding: 0.875rem 1.25rem;
				border: 0;
				border-radius: var(--radius);
				background: var(--accent);
				color: var(--accent-ink);
				font: inherit;
				font-size: 1.0625rem;
				font-weight: 600;
				text-align: center;
				text-decoration: none;
				cursor: pointer;
				line-height: 1.4;
			}

			.cta:focus-visible {
				outline: 3px solid var(--focus);
				outline-offset: 2px;
			}

			.cta[aria-disabled='true'] {
				background: var(--line);
				color: var(--ink-soft);
				cursor: not-allowed;
			}

			.note {
				margin: 0.875rem 0 0;
				font-size: 0.875rem;
				color: var(--ink-soft);
				text-align: center;
			}

			/* --- Fuß ---------------------------------------------------------- */

			footer {
				margin-top: 2.5rem;
				padding-top: 1.25rem;
				border-top: 1px solid var(--line);
				text-align: center;
				font-size: 0.875rem;
			}

			footer a {
				color: var(--ink-soft);
				text-decoration: underline;
				text-underline-offset: 3px;
				padding: 0.25rem 0.5rem;
				display: inline-block;
			}

			footer a:hover {
				color: var(--ink);
			}
		</style>
	</head>

	<body>
		<main>
			<div class="lang">
				<button type="button" data-lang="en" aria-pressed="true" aria-label="English" title="English">
					<!-- Union Jack, vereinfacht -->
					<svg viewBox="0 0 60 60" aria-hidden="true">
						<clipPath id="c"><circle cx="30" cy="30" r="30" /></clipPath>
						<g clip-path="url(#c)">
							<rect width="60" height="60" fill="#012169" />
							<path d="M0 0l60 60M60 0L0 60" stroke="#fff" stroke-width="12" />
							<path d="M0 0l60 60M60 0L0 60" stroke="#C8102E" stroke-width="6" />
							<path d="M30 0v60M0 30h60" stroke="#fff" stroke-width="20" />
							<path d="M30 0v60M0 30h60" stroke="#C8102E" stroke-width="12" />
						</g>
					</svg>
				</button>
				<button type="button" data-lang="de" aria-pressed="false" aria-label="Deutsch" title="Deutsch">
					<!-- Bundesflagge -->
					<svg viewBox="0 0 60 60" aria-hidden="true">
						<clipPath id="d"><circle cx="30" cy="30" r="30" /></clipPath>
						<g clip-path="url(#d)">
							<rect width="60" height="20" fill="#000" />
							<rect y="20" width="60" height="20" fill="#DD0000" />
							<rect y="40" width="60" height="20" fill="#FFCE00" />
						</g>
					</svg>
				</button>
			</div>

			<header>
				<img src="logo.png" alt="Anglican Chaplaincy of Bonn and Cologne" />
				<h1>Anglican Chaplaincy of Bonn and Cologne</h1>
				<p
					class="lead"
					data-en="Please support the work of our chaplaincy with your donation."
					data-de="Bitte unterstützen Sie die Arbeit unserer Gemeinde mit Ihrer Spende."
				>
					Please support the work of our chaplaincy with your donation.
				</p>
			</header>

			<form id="donation">
				<fieldset>
					<legend data-en="Choose an amount" data-de="Betrag wählen">Choose an amount</legend>

					<div class="amounts">
						<label>
							<input type="radio" name="amount" value="5" checked />
							<span>5&nbsp;€</span>
						</label>
						<label>
							<input type="radio" name="amount" value="10" />
							<span>10&nbsp;€</span>
						</label>
						<label>
							<input type="radio" name="amount" value="20" />
							<span>20&nbsp;€</span>
						</label>
					</div>

					<div class="custom">
						<label for="custom-amount" data-en="Or enter your own amount" data-de="Oder eigener Betrag"
							>Or enter your own amount</label
						>
						<div class="custom-field">
							<input
								id="custom-amount"
								type="number"
								inputmode="decimal"
								min="1"
								step="1"
								placeholder="50"
								autocomplete="off"
							/>
							<span class="currency" aria-hidden="true">€</span>
						</div>
					</div>
				</fieldset>

				<a id="cta" class="cta" href="#" data-en="Continue to betterplace.org" data-de="Weiter zu betterplace.org"
					>Continue to betterplace.org</a
				>

				<p
					class="note"
					data-en="Donations are processed securely by betterplace.org. You will receive a donation receipt from them."
					data-de="Die Spende wird sicher über betterplace.org abgewickelt. Die Zuwendungsbestätigung erhalten Sie von dort."
				>
					Donations are processed securely by betterplace.org. You will receive a donation receipt from them.
				</p>
			</form>

			<footer>
				<a href="https://anglicanbonncologne.de/impressum" data-en="Legal notice" data-de="Impressum">Legal notice</a>
				<a href="https://anglicanbonncologne.de/legal" data-en="Privacy" data-de="Datenschutz">Privacy</a>
			</footer>
		</main>

		<script>
			/* ----------------------------------------------------------------
			 * EINZIGE STELLE, DIE SPÄTER ANGEPASST WERDEN MUSS
			 *
			 * Sobald das betterplace-Projekt existiert, hier die Projekt-URL
			 * eintragen. Solange der Wert leer ist, zeigt die Seite einen
			 * Hinweis statt eines toten Buttons.
			 *
			 * AMOUNT_PARAM: Name des Query-Parameters, mit dem betterplace
			 * einen vorausgefüllten Betrag übernimmt. Ob betterplace das
			 * überhaupt unterstützt, ist noch NICHT verifiziert — siehe
			 * Notiz im PR. Auf null setzen, wenn nicht: dann wird der Betrag
			 * nicht übergeben und die Auswahl oben dient nur als Anhalt.
			 * ---------------------------------------------------------------- */
			const BETTERPLACE_URL = '';
			const AMOUNT_PARAM = 'amount';

			const texts = document.querySelectorAll('[data-en]');
			const langButtons = document.querySelectorAll('.lang button');
			const form = document.getElementById('donation');
			const custom = document.getElementById('custom-amount');
			const cta = document.getElementById('cta');

			/* --- Sprache ---------------------------------------------------- */

			const setLang = (lang) => {
				document.documentElement.lang = lang;
				texts.forEach((el) => {
					el.textContent = el.dataset[lang];
				});
				langButtons.forEach((b) => {
					b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
				});
				try {
					localStorage.setItem('lang', lang);
				} catch {
					/* Privater Modus o.ä. — Sprache gilt dann nur für diesen Besuch. */
				}
				updateCta();
			};

			langButtons.forEach((b) => {
				b.addEventListener('click', () => setLang(b.dataset.lang));
			});

			const initialLang = (() => {
				try {
					const saved = localStorage.getItem('lang');
					if (saved === 'en' || saved === 'de') return saved;
				} catch {
					/* ignorieren */
				}
				return navigator.language?.toLowerCase().startsWith('de') ? 'de' : 'en';
			})();

			/* --- Betrag ----------------------------------------------------- */

			/** Gewählter Betrag: eigenes Feld hat Vorrang, sonst die Kachel. */
			const selectedAmount = () => {
				const typed = Number.parseFloat(custom.value);
				if (Number.isFinite(typed) && typed > 0) return typed;
				return Number.parseFloat(form.amount.value);
			};

			/** Tippt jemand einen eigenen Betrag, verliert die Kachel ihre Auswahl. */
			custom.addEventListener('input', () => {
				const typed = custom.value.trim() !== '';
				form.querySelectorAll('input[name="amount"]').forEach((r) => {
					r.checked = false;
				});
				if (!typed) form.amount.value = '5';
				updateCta();
			});

			form.querySelectorAll('input[name="amount"]').forEach((radio) => {
				radio.addEventListener('change', () => {
					custom.value = '';
					updateCta();
				});
			});

			/* --- Zielverweis ------------------------------------------------ */

			function updateCta() {
				const lang = document.documentElement.lang;

				if (!BETTERPLACE_URL) {
					cta.setAttribute('aria-disabled', 'true');
					cta.removeAttribute('href');
					cta.textContent = lang === 'de' ? 'Spendenprojekt in Vorbereitung' : 'Donation project coming soon';
					return;
				}

				const url = new URL(BETTERPLACE_URL);
				const amount = selectedAmount();
				if (AMOUNT_PARAM && Number.isFinite(amount) && amount > 0) {
					url.searchParams.set(AMOUNT_PARAM, String(amount));
				}

				cta.href = url.toString();
				cta.rel = 'noopener';
				cta.removeAttribute('aria-disabled');
				cta.textContent = cta.dataset[lang];
			}

			setLang(initialLang);
		</script>
	</body>
</html>
