name: Playwright Tests
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          VITE_APIKEY: ${{ secrets.VITE_APIKEY }}
          VITE_AUTHDOMAIN: ${{ secrets.VITE_AUTHDOMAIN }}
          VITE_PROJECTID: ${{ secrets.VITE_PROJECTID }}
          VITE_STORAGEBUCKET: ${{ secrets.VITE_STORAGEBUCKET }}
          VITE_MESSAGINGSENDERID: ${{ secrets.VITE_MESSAGINGSENDERID }}
          VITE_APPID: ${{ secrets.VITE_APPID }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # Declared in src/env.ts, so SvelteKit refuses to start without them.
          # The tests never call these services, so placeholders are enough.
          PRIVATE_ANTHROPIC_API_KEY: e2e-placeholder
          PRIVATE_BREVO_API_KEY: e2e-placeholder
          PRIVATE_BREVO_WEBHOOK_SECRET: e2e-placeholder
          PRIVATE_RECAPTCHA_SECRET_KEY: e2e-placeholder
          PRIVATE_RESEND_API_KEY: e2e-placeholder
          BREVO_LIST: '0'
          BREVO_REDIRECTION_URL: http://localhost:5173
          NOTIFICATION_TO: e2e@example.invalid
          NOTIFICATION_FROM: e2e@example.invalid
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
