[build]
	command = "npm ci && npm run build"
	publish = "build"
	ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."
[build.environment]
	NODE_VERSION = "22.17.0"
	# npm 10 (Node 22.17's bundled version) mis-resolves the optional peer
	# dependency "@sveltejs/kit" of runed/bits-ui and then fails `npm ci` with
	# EUSAGE, demanding kit 2.70.4 although the project is on kit 3. npm 11
	# resolves the same lockfile cleanly, so pin it explicitly.
	NPM_VERSION = "11.6.0"
	# PRIVATE_* values legitimately appear in the server bundle — that code runs
	# inside the Netlify function and is never served to browsers. Scanning stays
	# on for the client bundle, where a leak would actually expose them.
	SECRETS_SCAN_OMIT_PATHS = ".svelte-kit/output/server/**,.netlify/server/**,.netlify/functions-internal/**"
[build.processing]
  skip_processing = false